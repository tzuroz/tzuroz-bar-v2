name: Download cocktail images

# Run by hand: Actions tab -> "Download cocktail images" -> "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download images
        run: python3 tools/download_images.py

      - name: Commit the images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add images cocktail_list1.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Store cocktail photos in images/ instead of linking to other sites"
            git push
          fi
